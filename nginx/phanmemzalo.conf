# ============================================================================
# Nginx reverse proxy cho phanmemzalo.com (web) + api.phanmemzalo.com (API)
#
# Cài đặt trên server (Ubuntu/Debian):
#   sudo apt install -y nginx
#   sudo cp nginx/phanmemzalo.conf /etc/nginx/sites-available/phanmemzalo.conf
#   sudo ln -s /etc/nginx/sites-available/phanmemzalo.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Bật HTTPS tự động (Let's Encrypt) — certbot sẽ TỰ thêm block 443 + redirect:
#   sudo apt install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d phanmemzalo.com -d www.phanmemzalo.com -d api.phanmemzalo.com
#
# YÊU CẦU TRƯỚC: DNS đã trỏ phanmemzalo.com, www, api → IP server;
# mở firewall 80/443 (sudo ufw allow 'Nginx Full').
# Container chạy local: FE 127.0.0.1:3000, BE 127.0.0.1:3001 (docker compose).
# ============================================================================

# ---- FRONTEND: phanmemzalo.com ----
server {
    listen 80;
    listen [::]:80;
    server_name phanmemzalo.com www.phanmemzalo.com;

    client_max_body_size 15m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 90s;
    }
}

# ---- BACKEND API: api.phanmemzalo.com ----
server {
    listen 80;
    listen [::]:80;
    server_name api.phanmemzalo.com;

    client_max_body_size 15m;   # cho upload ảnh (BE MAX_FILE_SIZE 5MB, để dư)

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}
